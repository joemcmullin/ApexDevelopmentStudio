<!--
  partials/nav.html: the shared header and the phone menu.

  WHAT THIS FILE IS
    The bar at the top of every page (Apex mark and name, and the links
    Advisory, Work, Build, About, Contact) and the full-screen phone menu
    that replaces the links on narrow screens.

  WHERE IT APPEARS
    Every page with an "@include nav.html" line (all pages except
    Privacy, Terms and the 404 page). The build drops this file in there.
    The comments at the top of this file are left out when it is dropped in.

  DEPENDS ON
    src/nav.js (opens and closes the phone menu) and the "nav" and "phone
    menu" styles in src/home.css.

  HOW TO EDIT
    - Desktop links ........ the <nav class="nav-links"> list.
    - Phone menu links ..... the <nav class="menu-in"> list. Keep it in step
                             with the desktop links. Number --i from 0 down
                             the list so the links arrive in order.
    - Tagline under name ... the <small> in the brand link.
-->
<header class="nav">
  <div class="wrap">
    <a class="brand" href="/">
      <svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="none" stroke="#F2B233" stroke-width="3"/><path d="M32 13 L45 47 L32 39 L19 47 Z" fill="#F2B233"/></svg>
      <span>Apex Development Studio LLC<small>Advisory · Security · Build</small></span>
    </a>
    <nav class="nav-links" aria-label="Main">
      <a href="/#advisory">Advisory</a>
      <a href="/#work">Work</a>
      <a href="/services/">Build</a>
      <a href="/about/">About</a>
      <a href="/#contact">Contact</a>
    </nav>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<div class="menu" id="menu" hidden>
  <div class="menu-rings" aria-hidden="true"><i></i><i></i><i></i></div>
  <nav class="menu-in" aria-label="Main">
    <a href="/#advisory" style="--i:0">Advisory</a>
    <a href="/#work" style="--i:1">Work</a>
    <a href="/services/" style="--i:2">Build</a>
    <div class="menu-sub" style="--i:3">
      <a href="/services/ios-app-development/">iOS apps</a>
      <a href="/services/android-app-development/">Android apps</a>
      <a href="/services/web-development/">Websites</a>
    </div>
    <a href="/about/" style="--i:4">About</a>
    <a href="/#contact" style="--i:5">Contact</a>
    <p class="menu-foot" style="--i:6">support@apexdevelopmentstudio.com</p>
  </nav>
</div>
