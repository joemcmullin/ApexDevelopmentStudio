<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#0C0B09;overflow:hidden}
canvas{position:absolute;inset:0}
.c{position:absolute;left:84px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:26px;color:#F3EEE4;font-family:"Plus Jakarta Sans",sans-serif}
.brand{display:flex;align-items:center;gap:18px;font-weight:800;font-size:30px;letter-spacing:-.01em}
h1{margin:0;font-size:92px;line-height:.98;font-weight:800;letter-spacing:-.03em}
h1 span{color:#F2B233}
.sub{font-family:"JetBrains Mono",monospace;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#B9B2A4}
</style></head><body>
<canvas id="t" width="1200" height="630"></canvas>
<div class="c">
  <div class="brand"><svg width="54" height="54" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="none" stroke="#F2B233" stroke-width="3"/><path d="M32 13 L45 47 L32 39 L19 47 Z" fill="#F2B233"/></svg>Apex Development Studio LLC</div>
  <h1>Built to hold up<br><span>in the field.</span></h1>
  <div class="sub">iOS · Android · Web</div>
</div>
<script>
const c=document.getElementById('t').getContext('2d'),W=1200,H=630,CELL=6,cols=W/CELL+1,rows=Math.ceil(H/CELL)+1,F=new Float32Array(cols*rows);
const hills=[[.86,.46,.2,1.3],[.62,.95,.2,.3],[.98,.1,.16,.25],[.35,.15,.18,.22]];
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const x=i*CELL/W,y=j*CELL/H;let v=.05*Math.sin(x*11+y*3)+.04*Math.sin(y*13-x*5+1.3)+.03*Math.sin((x+y)*21);for(const h of hills){const dx=(x-h[0])*W/H,dy=y-h[1];v+=h[3]*Math.exp(-(dx*dx+dy*dy)/(2*h[2]*h[2]))}F[j*cols+i]=v}
let max=0;for(const v of F)if(v>max)max=v;
const g=c.createRadialGradient(W*.86,H*.46,0,W*.86,H*.46,500);g.addColorStop(0,'rgba(242,178,51,.14)');g.addColorStop(1,'rgba(242,178,51,0)');c.fillStyle=g;c.fillRect(0,0,W,H);
for(let n=1;n*.075<max;n++){const lv=n*.075,top=lv>max-.12;c.beginPath();
for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){const a=F[j*cols+i],b=F[j*cols+i+1],cc=F[(j+1)*cols+i+1],d=F[(j+1)*cols+i];const idx=(a>lv?8:0)|(b>lv?4:0)|(cc>lv?2:0)|(d>lv?1:0);if(!idx||idx===15)continue;const x=i*CELL,y=j*CELL;
const T=[x+CELL*(lv-a)/(b-a),y],Rr=[x+CELL,y+CELL*(lv-b)/(cc-b)],B=[x+CELL*(lv-d)/(cc-d),y+CELL],L=[x,y+CELL*(lv-a)/(d-a)];const s=(p,q)=>{c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1])};
switch(idx){case 1:case 14:s(L,B);break;case 2:case 13:s(B,Rr);break;case 3:case 12:s(L,Rr);break;case 4:case 11:s(T,Rr);break;case 5:s(L,T);s(B,Rr);break;case 6:case 9:s(T,B);break;case 7:case 8:s(L,T);break;case 10:s(L,B);s(T,Rr);break}}
c.strokeStyle=top?'#F2B233':(n%5===0?'rgba(242,178,51,.42)':'rgba(242,178,51,.18)');c.lineWidth=top?2:(n%5===0?1.4:1);c.stroke()}
const v=c.createLinearGradient(0,0,900,0);v.addColorStop(0,'rgba(12,11,9,.6)');v.addColorStop(.6,'rgba(12,11,9,.45)');v.addColorStop(1,'rgba(12,11,9,0)');c.fillStyle=v;c.fillRect(0,0,900,H);
</script></body></html>
