# ============================================================================
# deploy.yml: builds the site and publishes it to GitHub Pages.
# ============================================================================
#
# WHAT THIS FILE IS
#   A GitHub Actions workflow. On every push to main (or when run by hand
#   from the Actions tab) it installs the packages, runs "npm run build",
#   checks the custom domain survived, carries forward older asset files so
#   cached pages still load, and publishes dist/ to GitHub Pages.
#   It replaced the old "deploy from a branch" setup, where the built files
#   had to be committed by hand. The repo now holds source only.
#
# WHERE IT APPEARS
#   Nowhere on the page. Runs on GitHub after each push.
#
# HOW TO EDIT
#   - Node version ......... node-version under setup-node (20).
#   - Custom domain ........ public/CNAME. The check below fails the build if
#                            it goes missing or changes.
#   - Asset archive age .... "-mtime +30" (days) in the carry-forward step.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run it from the Actions tab

# Least privilege: read the code, write a Pages deployment, and prove
# identity to Pages via OIDC. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the newer one finish and cancel the
# older, but never cancel a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci installs exactly what package-lock.json pins, so a build here
      # matches a build locally.
      - run: npm ci
      - run: npm run build

      # Fail loudly rather than publishing a site that silently loses the
      # custom domain. Switching Pages to Actions once cleared the cname
      # setting outright, so the file in the artifact is what keeps
      # apexdevelopmentstudio.com pointing here.
      - name: Verify CNAME survived the build
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing — the custom domain would break"; exit 1; }
          grep -qx 'apexdevelopmentstudio.com' dist/CNAME \
            || { echo "::error::dist/CNAME has unexpected contents: $(cat dist/CNAME)"; exit 1; }
          echo "CNAME ok: $(cat dist/CNAME)"

      # Keep earlier builds' hashed assets. GitHub Pages lets browsers cache
      # each page for 10 minutes, and every deploy replaces /assets with new
      # file names. A phone still holding the previous page would request
      # stylesheets that no longer exist and render unstyled. So each deploy
      # carries forward (a) whatever the live site references right now and
      # (b) a rolling 30-day archive kept in the Actions cache. Old files are
      # only ever added, never overwrite this build's own.
      - name: Restore asset archive
        uses: actions/cache@v4
        with:
          path: .asset-archive
          key: pages-assets-${{ github.run_id }}
          restore-keys: pages-assets-

      - name: Carry forward earlier builds' assets
        run: |
          mkdir -p .asset-archive
          # every page the live site serves: sitemap URLs plus the 404 page
          urls=$(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##')
          urls="$urls https://apexdevelopmentstudio.com/404.html"
          for u in $urls; do
            curl -fsS --max-time 20 "$u" 2>/dev/null | grep -o '/assets/[A-Za-z0-9._-]*' || true
          done | sort -u | while read -r a; do
            f=".asset-archive/$(basename "$a")"
            [ -f "$f" ] || curl -fsS --max-time 20 -o "$f" "https://apexdevelopmentstudio.com$a" || rm -f "$f"
          done
          rsync -a --ignore-existing .asset-archive/ dist/assets/
          rsync -a --ignore-existing dist/assets/ .asset-archive/
          find .asset-archive -type f -mtime +30 -delete
          echo "assets published: $(ls dist/assets | wc -l) (archive: $(ls .asset-archive | wc -l))"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
