# Build the Vite site and publish it to GitHub Pages.
#
# Replaces the old "deploy from a branch" setup, where the compiled output
# had to be committed by hand. Now the repo holds source only; this workflow
# produces dist/ and hands it straight to Pages.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run it from the Actions tab

# Least privilege: read the code, write a Pages deployment, and prove
# identity to Pages via OIDC. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the newer one finish and cancel the
# older — but never cancel a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci installs exactly what package-lock.json pins, so a build here
      # matches a build locally.
      - run: npm ci
      - run: npm run build

      # Fail loudly rather than publishing a site that silently loses the
      # custom domain. Switching Pages to Actions once cleared the cname
      # setting outright, so the file in the artifact is what keeps
      # apexdevelopmentstudio.com pointing here.
      - name: Verify CNAME survived the build
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing — the custom domain would break"; exit 1; }
          grep -qx 'apexdevelopmentstudio.com' dist/CNAME \
            || { echo "::error::dist/CNAME has unexpected contents: $(cat dist/CNAME)"; exit 1; }
          echo "CNAME ok: $(cat dist/CNAME)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
